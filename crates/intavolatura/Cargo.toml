[package]
name = "intavolatura"
version.workspace = true
edition.workspace = true

[dependencies]
intavolatura-core = { path = "../intavolatura-core" }
slint = "1.18"
rfd = "0.17"
pdf-writer = "0.15.0"
subsetter = { version = "0.2.6", default-features = false }
ttf-parser = "0.25.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
cpal = "0.18.2"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
slint = { version = "1.18", features = ["renderer-software"] }
png = "0.17"
